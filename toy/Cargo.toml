[package]
name = "toy"
version = "0.1.0"
edition = "2021"


[dependencies]
half = "2.4.1"
hdf5 = { package = "hdf5-metno", version = "0.10.0", features = ["f16"] }
kmeans = "1.1.0"
ndarray = "=0.16.1"
rand = { version = "0.8.5", features = ["small_rng"] }
rayon = "1.10.0"
# tch = "0.17.0"
tch = { version = "0.19.0", features = ["download-libtorch"] }

# [profile.release]
# lto = "fat"
# codegen-units = 1
# debug = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
panic = "abort"
strip = "symbols"
