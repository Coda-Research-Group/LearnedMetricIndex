[package]
name = "rust-lmi"
version = "0.1.0"
edition = "2024"

[dependencies]
torch-sys = "0.18.1"
tch = "0.18.1"
half = "2.4.1"
hdf5 = { package = "hdf5-metno", version = "0.10.0", features = ["f16"] }
kmeans = "1.1.0"
ndarray = "=0.16.1"
rand = { version = "0.8.5", features = ["small_rng"] }
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
rand = { version = "0.8.5", features = ["small_rng"] }
criterion = "0.5.1"

[[bench]]
name = "dot_product"
harness = false