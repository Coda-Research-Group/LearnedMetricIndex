[package]
name = "lmi"
version = "0.1.0"
edition = "2024"

[lib]
name = "lmi"
crate-type = ["cdylib"]

[dependencies]
tch = "0.18.1"
pyo3 = { version = "0.21.2", features = ["extension-module"] }
pyo3-tch = "0.18.1"
rust-lmi = { path = "../rust_lmi" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
